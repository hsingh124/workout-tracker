<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Modern Workout Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f8fafc" />
  <style>
    :root {
      /* Light Theme (Default) */
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --input-bg: #f1f5f9;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --scheme: light;
    }

    [data-theme="dark"] {
      /* Dark Theme */
      --primary: #3b82f6;
      --primary-soft: #1e3a8a;
      --bg: #111827;
      --card-bg: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --input-bg: #374151;
      --danger: #f87171;
      --danger-bg: #450a0a;
      --nav-bg: rgba(31, 41, 55, 0.95);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --scheme: dark;
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font-main);
      color: var(--text-main);
      font-size: 16px;
      padding-bottom: 90px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* --- Typography & Header --- */
    header { margin-bottom: 1.5rem; }
    
    h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.025em; }
    h1 { font-size: 1.75rem; }
    h2 { font-size: 1.25rem; margin-bottom: 1rem; }

    /* --- Cards --- */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .row { display: flex; align-items: center; gap: 0.75rem; }
    .col { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .sb { justify-content: space-between; }

    /* --- Forms --- */
    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 1rem;
      color: var(--text-main);
      transition: all 0.2s;
      color-scheme: var(--scheme);
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* --- Buttons --- */
    button {
      cursor: pointer;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 12px;
      padding: 0.85rem 1.5rem;
      transition: transform 0.1s, background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:active { transform: scale(0.98); }

    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-ghost { background: transparent; color: var(--text-muted); padding: 0.5rem; }
    .btn-danger { background: var(--danger-bg); color: var(--danger); width: 100%; border: 1px solid var(--danger); }
    
    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 50%;
      box-shadow: var(--shadow);
    }

    /* --- Log List --- */
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
    }
    .log-item:last-child { border-bottom: none; }
    
    .log-info h4 { margin: 0 0 0.2rem 0; font-size: 1rem; color: var(--text-main); }
    .log-details { font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
    
    .pill { font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
    .pill-drop { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .pill-time { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

    /* --- Tabs --- */
    .view { display: none; animation: fadein 0.2s; }
    .view.active { display: block; }
    @keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* --- Navigation --- */
    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0 1.5rem 0;
      z-index: 100;
      transition: background 0.3s ease;
    }
    .nav-item {
      flex: 1; text-align: center; padding: 0.5rem;
      color: var(--text-muted);
      font-size: 0.75rem; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .nav-item.active { color: var(--primary); font-weight: 600; }
    .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }

    /* --- Rest Timer --- */
    #rest-timer-float {
      position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
      background: var(--text-main); color: var(--card-bg);
      padding: 0.6rem 1.2rem; border-radius: 99px;
      font-variant-numeric: tabular-nums; font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      display: none; z-index: 99; align-items: center; gap: 8px;
    }
    #rest-timer-float.active { display: flex; }
    .stop-timer {
        background: rgba(128,128,128,0.3); border-radius: 50%;
        width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
        font-size: 12px; cursor: pointer;
    }

    /* --- Records Page --- */
    .record-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem; border-bottom: 1px solid var(--border);
    }
    .record-item:last-child {
      border-bottom: none;
    }
    .record-val { text-align: right; }
    .big-num { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .sub-text { font-size: 0.8rem; color: var(--text-muted); }

    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-muted); }

    /* --- Checkboxes --- */
    input[type="checkbox"] {
      accent-color: var(--primary);
      cursor: pointer;
    }

  </style>
</head>
<body>

  <div id="rest-timer-float">
    <span style="opacity:0.7; font-size:0.85rem;">Rest</span>
    <span id="timer-display">00:00</span>
    <div class="stop-timer" id="stop-timer-btn">✕</div>
  </div>

  <div id="view-tracker" class="view active container">
    <header>
      <div class="row sb" style="margin-bottom: 0.8rem;">
        <h1>Workout Log</h1>
        <button id="theme-toggle" class="btn-icon">🌙</button>
      </div>
      <input type="date" id="date-picker" />
    </header>

    <div class="card">
      <div class="col">
        <label>Exercise</label>
        <input list="exercise-list" id="exercise-input" placeholder="e.g. Bench Press" autocomplete="off" />
        <datalist id="exercise-list"></datalist>
      </div>
      
      <div class="row" style="margin-top: 0.5rem;">
        <div class="col">
          <label>Weight (kg)</label>
          <input type="number" id="weight-input" placeholder="0" inputmode="decimal" />
        </div>
        <div class="col">
          <label>Reps</label>
          <input type="number" id="reps-input" placeholder="0" inputmode="numeric" />
        </div>
      </div>

      <div class="row sb" style="margin-top: 1rem;">
        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
          <input type="checkbox" id="dropset-check" style="width:1.2rem; height:1.2rem;">
          Drop Set
        </label>
        <button id="add-btn" class="btn-primary" style="width: auto; padding-left: 2rem; padding-right: 2rem;">Log Set</button>
      </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
      <div style="padding: 1rem; background: var(--bg); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.9rem; color: var(--text-muted);">
        Today's Session
      </div>
      <div id="daily-log" style="padding: 0 1rem;">
        </div>
      <div id="empty-msg" class="empty-state">No sets logged today.</div>
    </div>
    
    <button id="clear-day-btn" class="btn-danger" style="margin-top:1rem;">Clear Entire Day</button>
  </div>

  <div id="view-records" class="view container">
    <h1>Personal Records</h1>
    <div class="card" style="margin-top: 1.5rem;">
      <input type="text" id="search-records" placeholder="Search exercises..." />
    </div>
    <div class="card" style="padding: 0;">
      <div id="records-list"></div>
    </div>
  </div>

  <div id="view-settings" class="view container">
    <h1>Data & Settings</h1>
    
    <div class="card" style="margin-top: 1.5rem;">
      <h2>Export Data</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">
        Download all your workout history as a CSV file.
      </p>
      <button id="export-btn" class="btn-primary">Download CSV</button>
    </div>

    <div class="card">
      <h2>Import Data</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">
        Import a CSV file. Ensure the format matches the export format.
      </p>
      <input type="file" id="import-file" accept=".csv" style="margin-bottom: 1rem;" />
      <button id="import-btn" class="btn-primary" style="background: var(--text-main); color: var(--card-bg);">Import CSV</button>
    </div>
  </div>

  <nav class="nav-bar">
    <div class="nav-item active" onclick="switchView('tracker', this)">
      <div class="nav-icon">📝</div>
      <span>Tracker</span>
    </div>
    <div class="nav-item" onclick="switchView('records', this)">
      <div class="nav-icon">🏆</div>
      <span>Records</span>
    </div>
    <div class="nav-item" onclick="switchView('settings', this)">
      <div class="nav-icon">⚙️</div>
      <span>Data</span>
    </div>
  </nav>

  <script>
    // --- CONFIG & STATE ---
    const STORAGE_KEY = "simpleWorkoutLog_v1";
    const EXERCISE_KEY = "simpleWorkoutExercises_v1";
    const THEME_KEY = "simpleWorkoutTheme";
    
    let restInterval;
    let restStartTime = null;
    const DEFAULT_EXERCISES = ["Bench Press", "Squat", "Deadlift", "Overhead Press", "Pull Up", "Dumbbell Curl", "Tricep Extension"];

    // --- DOM ELEMENTS ---
    const datePicker = document.getElementById('date-picker');
    const exerciseInput = document.getElementById('exercise-input');
    const weightInput = document.getElementById('weight-input');
    const repsInput = document.getElementById('reps-input');
    const dropsetCheck = document.getElementById('dropset-check');
    const logContainer = document.getElementById('daily-log');
    const emptyMsg = document.getElementById('empty-msg');
    const exerciseDatalist = document.getElementById('exercise-list');
    const themeToggle = document.getElementById('theme-toggle');

    // --- INITIALIZATION ---
    function init() {
      // Load Theme
      const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      setTheme(savedTheme);

      // Load Data
      datePicker.value = new Date().toISOString().split('T')[0];
      loadExercises();
      renderLog();
      renderRecords();
    }

    // --- THEME HANDLING ---
    function setTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem(THEME_KEY, themeName);
      themeToggle.textContent = themeName === 'dark' ? '☀️' : '🌙';
      
      // Update the iPhone Status Bar Color
      const color = themeName === 'dark' ? '#111827' : '#f8fafc'; // Matches your CSS --bg variable
      document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
    }

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // --- DATA HANDLING ---
    function getData() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
    function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function getExercises() { return JSON.parse(localStorage.getItem(EXERCISE_KEY) || JSON.stringify(DEFAULT_EXERCISES)); }
    function saveExercises(list) { localStorage.setItem(EXERCISE_KEY, JSON.stringify(list)); }

    // --- CORE: ADD SET ---
    document.getElementById('add-btn').addEventListener('click', () => {
      const date = datePicker.value;
      const exercise = exerciseInput.value.trim();
      const weight = weightInput.value;
      const reps = repsInput.value;
      const isDrop = dropsetCheck.checked;

      if (!exercise || !reps) { alert("Please enter exercise and reps"); return; }

      // Update Exercise List
      const exList = getExercises();
      if (!exList.includes(exercise)) {
        exList.push(exercise);
        exList.sort();
        saveExercises(exList);
        loadExercises();
      }

      const data = getData();
      if (!data[date]) data[date] = [];

      const now = new Date();
      const timeString = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

      data[date].push({
        exercise, weight, reps, isDropSet: isDrop, time: timeString, timestamp: Date.now()
      });

      saveData(data);
      renderLog();
      renderRecords();
      startRestTimer();

      weightInput.value = "";
      repsInput.value = "";
      dropsetCheck.checked = false;
      repsInput.focus();
    });

    // --- RENDER LOG ---
    function renderLog() {
      const date = datePicker.value;
      const data = getData();
      const sets = data[date] || [];
      
      logContainer.innerHTML = '';
      
      if (sets.length === 0) {
        emptyMsg.style.display = 'block';
        document.getElementById('clear-day-btn').style.display = 'none';
      } else {
        emptyMsg.style.display = 'none';
        document.getElementById('clear-day-btn').style.display = 'block';
        
        sets.forEach((set, index) => {
          const item = document.createElement('div');
          item.className = 'log-item';
          
          let badges = `<span class="pill pill-time">${set.time || '--:--'}</span>`;
          if(set.isDropSet) badges += ` <span class="pill pill-drop">Drop</span>`;

          item.innerHTML = `
            <div class="log-info">
              <h4>${set.exercise}</h4>
              <div class="log-details">
                <span style="font-weight:600; color:var(--text-main);">${set.weight} kg</span> × <span>${set.reps} reps</span>
                ${badges}
              </div>
            </div>
            <button class="btn-ghost" onclick="deleteSet('${date}', ${index})">✕</button>
          `;
          logContainer.appendChild(item);
        });
      }
    }

    window.deleteSet = function(date, index) {
      const data = getData();
      if (data[date]) {
        data[date].splice(index, 1);
        if(data[date].length === 0) delete data[date];
        saveData(data);
        renderLog();
        renderRecords();
      }
    };

    document.getElementById('clear-day-btn').addEventListener('click', () => {
      if(confirm("Clear all data for this date?")) {
        const data = getData();
        delete data[datePicker.value];
        saveData(data);
        renderLog();
        renderRecords();
      }
    });

    datePicker.addEventListener('change', renderLog);

    // --- HELPERS ---
    function loadExercises() {
      const list = getExercises();
      exerciseDatalist.innerHTML = '';
      list.forEach(ex => {
        const opt = document.createElement('option');
        opt.value = ex;
        exerciseDatalist.appendChild(opt);
      });
    }

    // --- RECORDS ---
    function renderRecords() {
      const query = document.getElementById('search-records').value.toLowerCase();
      const data = getData();
      const stats = {}; 

      Object.keys(data).forEach(dateKey => {
        data[dateKey].forEach(set => {
          const exName = set.exercise;
          const weight = parseFloat(set.weight) || 0;
          const reps = parseInt(set.reps) || 0;
          if (!stats[exName]) stats[exName] = { maxWeight: 0, reps: 0 };
          if (weight > stats[exName].maxWeight) {
            stats[exName] = { maxWeight: weight, reps: reps };
          } else if (weight === stats[exName].maxWeight && reps > stats[exName].reps) {
            stats[exName].reps = reps;
          }
        });
      });

      const listContainer = document.getElementById('records-list');
      listContainer.innerHTML = '';
      const sortedNames = Object.keys(stats).sort();
      let hasResults = false;

      sortedNames.forEach(name => {
        if (name.toLowerCase().includes(query)) {
          hasResults = true;
          const rec = stats[name];
          const el = document.createElement('div');
          el.className = 'record-item';
          el.innerHTML = `
            <div style="font-weight:600;">${name}</div>
            <div class="record-val">
              <div class="big-num">${rec.maxWeight} <span style="font-size:0.8rem;">kg</span></div>
              <div class="sub-text">for ${rec.reps} reps</div>
            </div>
          `;
          listContainer.appendChild(el);
        }
      });

      if (!hasResults) listContainer.innerHTML = '<div class="empty-state">No records found.</div>';
    }
    document.getElementById('search-records').addEventListener('input', renderRecords);

    // --- TIMER ---
    function startRestTimer() {
      restStartTime = Date.now();
      const timerEl = document.getElementById('rest-timer-float');
      const display = document.getElementById('timer-display');
      timerEl.classList.add('active');
      if(restInterval) clearInterval(restInterval);
      restInterval = setInterval(() => {
        const diff = Math.floor((Date.now() - restStartTime) / 1000);
        const m = Math.floor(diff / 60).toString().padStart(2,'0');
        const s = (diff % 60).toString().padStart(2,'0');
        display.textContent = `${m}:${s}`;
      }, 1000);
    }
    document.getElementById('stop-timer-btn').addEventListener('click', () => {
      clearInterval(restInterval);
      document.getElementById('rest-timer-float').classList.remove('active');
    });

    // --- IMPORT/EXPORT ---
    document.getElementById('export-btn').addEventListener('click', () => {
      const data = getData();
      let csv = "Date,Exercise,Weight,Reps,Time,IsDropSet\n";
      Object.keys(data).sort().forEach(d => {
        data[d].forEach(set => {
          const safeEx = set.exercise.includes(',') ? `"${set.exercise}"` : set.exercise;
          csv += `${d},${safeEx},${set.weight},${set.reps},${set.time},${set.isDropSet}\n`;
        });
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = window.URL.createObjectURL(blob);
      a.download = `workout_data_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    });

    document.getElementById('import-btn').addEventListener('click', () => {
      const file = document.getElementById('import-file').files[0];
      if (!file) return alert("Please select a CSV file.");
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const lines = e.target.result.split('\n');
          const data = getData();
          let count = 0;
          for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const parts = line.split(',');
            if(parts.length < 4) continue;
            const date = parts[0];
            const exercise = parts[1].replace(/"/g, '');
            if (!data[date]) data[date] = [];
            data[date].push({ exercise, weight: parts[2], reps: parts[3], time: parts[4]||"00:00", isDropSet: parts[5]==='true' });
            count++;
          }
          saveData(data);
          alert(`Imported ${count} sets.`);
          init();
        } catch (err) { alert("Error parsing CSV."); }
      };
      reader.readAsText(file);
    });

    // --- NAVIGATION ---
    window.switchView = function(viewName, navEl) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${viewName}`).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      navEl.classList.add('active');
      if (viewName === 'records') renderRecords();
    }

    init();
  </script>
</body>
</html>
